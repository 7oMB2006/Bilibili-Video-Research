<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">证据流</title>
  <desc id="desc">一个 Bilibili 视频来源可以产生语言、视觉或多模态证据，并汇总为带有溯源、时间戳和不确定性说明的研究报告。</desc>
  <rect width="1200" height="390" fill="#0d1117"/>
  <text x="54" y="65" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="750" letter-spacing="-0.8">一个来源，三种证据契约</text>
  <text x="54" y="99" fill="#8d98a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="500">根据答案真正依赖的内容选择研究模式。</text>
  <rect x="54" y="148" width="194" height="146" rx="14" fill="#24131c" stroke="#f25d8e"/>
  <text x="79" y="189" fill="#ffdce8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Microsoft YaHei', monospace" font-size="18" font-weight="700">BILIBILI 链接</text>
  <text x="79" y="224" fill="#d2d9e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">标题 · 元数据</text>
  <text x="79" y="253" fill="#d2d9e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18">字幕 · 视频</text>
  <path d="M248 221H306" stroke="#8b949e" stroke-width="2"/><path d="M300 214L313 221 300 228" fill="none" stroke="#8b949e" stroke-width="2"/>
  <rect x="324" y="122" width="216" height="72" rx="12" fill="#302717"/><text x="347" y="153" fill="#f6bd60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="700">LANGUAGE<tspan fill="#d8a94e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="550">（语言）</tspan></text><text x="347" y="179" fill="#c5ced8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">字幕 → ASR 回退</text>
  <rect x="324" y="209" width="216" height="72" rx="12" fill="#172b42"/><text x="347" y="240" fill="#66b1ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="700">VISION<tspan fill="#70a9e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="550">（视觉）</tspan></text><text x="347" y="266" fill="#c5ced8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">仅静音视频帧</text>
  <rect x="324" y="296" width="216" height="72" rx="12" fill="#281f39"/><text x="338" y="327" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700">MULTIMODAL<tspan fill="#c39bea" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="550">（多模态）</tspan></text><text x="347" y="353" fill="#c5ced8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">音频 + 视频帧</text>
  <path d="M540 158H636M540 245H636M540 332H636" stroke="#8b949e" stroke-width="2"/><path d="M630 151L643 158 630 165M630 238L643 245 630 252M630 325L643 332 630 339" fill="none" stroke="#8b949e" stroke-width="2"/>
  <rect x="655" y="154" width="490" height="174" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="688" y="197" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Display', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" font-weight="730" letter-spacing="-0.4">研究报告</text>
  <path d="M688 217H1110" stroke="#30363d"/>
  <text x="688" y="248" fill="#8d98a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600">模式</text>
  <rect x="734" y="227" width="118" height="29" rx="7" fill="#302717"/><text x="744" y="247" fill="#f6bd60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700">LANGUAGE<tspan fill="#d8a94e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">（语言）</tspan></text>
  <rect x="859" y="227" width="100" height="29" rx="7" fill="#172b42"/><text x="869" y="247" fill="#66b1ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700">VISION<tspan fill="#70a9e5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">（视觉）</tspan></text>
  <rect x="966" y="227" width="154" height="29" rx="7" fill="#281f39"/><text x="976" y="247" fill="#d2a8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700">MULTIMODAL<tspan fill="#c39bea" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11">（多模态）</tspan></text>
  <text x="688" y="287" fill="#d2d9e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">溯源　元数据 · 字幕 / ASR · 视频帧</text>
  <text x="688" y="315" fill="#d2d9e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">时间戳 / 限制　在可用时明确说明</text>
</svg>